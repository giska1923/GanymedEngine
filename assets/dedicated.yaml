# What GanymedDedicated loads once the fleet agent has allocated a match.
# The agent flags (--server-id, --agent, --game-port, --advertise, --public-key) are not
# in here: the process refuses to start without them.
#
# Scene is relative to AssetRoot. MatchSeconds and Outcome are what the stub's timer
# reports; --match-seconds, --outcome, --scene and --load-delay override them.
#
# On first-game the Proving Ground's GameMode ends the match (N5 G6): victory, or defeat by a
# wipe, its 15-minute limit, or everyone leaving. The timer here is only the backstop for a game
# mode that never decides: 18 minutes, then defeat.
# --load-delay holds the main thread after the allocation is acknowledged, so the
# slow-load check can prove health does not depend on the frame.

AssetRoot: assets
Scene: scenes/ProvingGround.ganymede
MatchSeconds: 1080
Outcome: defeat
LoadDelaySeconds: 0
